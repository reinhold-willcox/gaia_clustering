[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-clustering"
version = "0.1.0"
description = "Gaia membership and hierarchical velocity-dispersion pipeline for stellar associations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Reinhold Willcox", email = "reinhold.willcox@gmail.com" },
]
keywords = [
    "gaia",
    "stellar associations",
    "extreme deconvolution",
    "velocity dispersion",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "plotly",
    "astropy",
    "pymc",
    "arviz",
    "corner",
]

[project.optional-dependencies]
dev = ["pytest"]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/rwillcox/gaia_clustering"
Documentation = "https://rwillcox.github.io/gaia_clustering/"
Issues = "https://github.com/rwillcox/gaia_clustering/issues"
Source = "https://github.com/rwillcox/gaia_clustering"

[project.scripts]
gaia-clustering = "gaia_clustering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
